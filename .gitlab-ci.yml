variables:
  MOBITOPP_COMMIT_HASH: $CI_COMMIT_SHA
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  image: gradle:jdk25
  before_script:
    - |
      echo "CI ref:                 ${CI_COMMIT_REF_NAME:-unset}"
      echo "CI branch:              ${CI_COMMIT_BRANCH:-unset}"
      echo "CI tag:                 ${CI_COMMIT_TAG:-unset}"
      echo "Protected ref:          ${CI_COMMIT_REF_PROTECTED:-unset}"
      echo "RC_REPO_URL present:    $([ -n "${RC_REPO_URL:-}" ] && echo yes || echo no)"
      echo "RC username present:    $([ -n "${RC_REPO_USERNAME:-}" ] && echo yes || echo no)"
      echo "RC password present:    $([ -n "${RC_REPO_PASSWORD:-}" ] && echo yes || echo no)"
      echo "Snapshot URL present:   $([ -n "${LOCAL_SNAPSHOT_REPO_URL:-}" ] && echo yes || echo no)"
      echo "Local username present: $([ -n "${LOCAL_REPO_USERNAME:-}" ] && echo yes || echo no)"
      echo "Local password present: $([ -n "${LOCAL_REPO_PASSWORD:-}" ] && echo yes || echo no)"
      
      cat > "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts" <<'EOF'
      println("Init script loaded")
      
      settingsEvaluated {
          println("Settings evaluated; injecting internal repositories")
      
          dependencyResolutionManagement.repositories {
              val rcUrl = System.getenv("RC_REPO_URL")
              println("RC repository variable present: ${!rcUrl.isNullOrBlank()}")
      
              if (!rcUrl.isNullOrBlank()) {
                  maven {
                      name = "InjectedRcRepository"
                      url = uri(rcUrl)
                      credentials {
                          username = System.getenv("RC_REPO_USERNAME")
                          password = System.getenv("RC_REPO_PASSWORD")
                      }
                  }
      
                  println("Injected repository: InjectedRcRepository")
              }
      
              val snapshotUrl = System.getenv("LOCAL_SNAPSHOT_REPO_URL")
              println("Snapshot repository variable present: ${!snapshotUrl.isNullOrBlank()}")
      
              if (!snapshotUrl.isNullOrBlank()) {
                  maven {
                      name = "InjectedSnapshotRepository"
                      url = uri(snapshotUrl)
                      credentials {
                          username = System.getenv("LOCAL_REPO_USERNAME")
                          password = System.getenv("LOCAL_REPO_PASSWORD")
                      }
                  }
      
                  println("Injected repository: InjectedSnapshotRepository")
              }
      
              println(
                  "Configured repositories: " +
                      map { repository -> repository.name }.joinToString()
              )
          }
      }
      EOF
      
      echo "Init script created:"
      ls -l "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts"

cache:
  key: "gradle-$CI_PROJECT_ID"
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .kotlin

stages: # List of stages for jobs, and their order of execution
  - build
  - test
  - publish
#Removed for syncing public publication processes.
#include:
#  # trigger downstream projects and create version number
#  - local: gitlab-pipeline/downstream_based_version_number.yml

build-job:
  stage: build
  script:
    - ./gradlew compileKotlin --build-cache --init-script "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts"

test-job:
  stage: test
  needs: [ build-job ]
  script:
    - ./gradlew test koverXmlReport koverLog --build-cache --init-script "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/**/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: build/reports/kover/report.xml

    paths:
      - build/reports/kover/*
  coverage: "/application line coverage: ([0-9]+\\.?[0-9]*)%/"

code-style:
  stage: test
  needs: [ build-job ]
  script:
    - ./gradlew detektGenerateConfig --build-cache --init-script "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts"
    - ./gradlew detekt --build-cache --init-script "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts"

snapshot-publish-job:
  stage: publish
  needs:
    - test-job
    - code-style
  resource_group: nexus-publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - SNAPSHOT_VERSION="${MAJOR}.${MINOR}-SNAPSHOT"
    - echo "Publishing snapshot ${SNAPSHOT_VERSION}"
    - |
      ./gradlew publish \
        --build-cache \
        --init-script "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts" \
        -PdoPublish=true \
        -PbuildVersion="$SNAPSHOT_VERSION" \
        -PlocalUrl="$LOCAL_SNAPSHOT_REPO_URL" \
        -PlocalRepoUser="$LOCAL_REPO_USERNAME" \
        -PlocalRepoPassword="$LOCAL_REPO_PASSWORD"

rc-publish-job:
  stage: publish
  needs:
    - test-job
    - code-style
  resource_group: nexus-publish
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  script:
    - |
      set -eu
      
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        MANUAL_RELEASE=false
        TAG_VERSION="${CI_COMMIT_TAG#v}"
      
        case "$TAG_VERSION" in
          *[!0-9.]* | *.*.*.* | .* | *.)
            echo "Invalid release tag: $CI_COMMIT_TAG"
            echo "Expected format: v1.2.3 or 1.2.3"
            exit 1
            ;;
        esac
      
        RELEASE_MAJOR="${TAG_VERSION%%.*}"
        VERSION_REMAINDER="${TAG_VERSION#*.}"
        RELEASE_MINOR="${VERSION_REMAINDER%%.*}"
        RELEASE_PATCH="${VERSION_REMAINDER#*.}"
      
        case "$RELEASE_MAJOR:$RELEASE_MINOR:$RELEASE_PATCH" in
          *[!0-9:]* | :* | *::* | *:)
            echo "Invalid release tag: $CI_COMMIT_TAG"
            exit 1
            ;;
        esac
      
        RELEASE_VERSION="$TAG_VERSION"
        NEXT_MAJOR="$RELEASE_MAJOR"
        NEXT_MINOR="$((RELEASE_MINOR + 1))"
      else
        MANUAL_RELEASE=true
        RELEASE_VERSION="${MAJOR}.${MINOR}.0"
        NEXT_MAJOR="$MAJOR"
        NEXT_MINOR="$((MINOR + 1))"
      
        if git ls-remote --exit-code \
          --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
          echo "Tag v$RELEASE_VERSION already exists"
          exit 1
        fi
      fi
      
      echo "Release version: $RELEASE_VERSION"
      echo "Next MAJOR:      $NEXT_MAJOR"
      echo "Next MINOR:      $NEXT_MINOR"
      
      echo "Publishing $RELEASE_VERSION to the RC repository"
      
      ./gradlew publish \
        --no-configuration-cache \
        --init-script "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts" \
        -PdoPublish=true \
        -PbuildVersion="$RELEASE_VERSION" \
        -PlocalUrl="$RC_REPO_URL" \
        -PlocalRepoUser="$RC_REPO_USERNAME" \
        -PlocalRepoPassword="$RC_REPO_PASSWORD"
      
      echo "Publishing $RELEASE_VERSION to the local release repository"
      
      ./gradlew publish \
        --no-configuration-cache \
        --init-script "$CI_PROJECT_DIR/internal-repositories.init.gradle.kts" \
        -PdoPublish=true \
        -PbuildVersion="$RELEASE_VERSION" \
        -PlocalUrl="$LOCAL_REPO_URL" \
        -PlocalRepoUser="$LOCAL_REPO_USERNAME" \
        -PlocalRepoPassword="$LOCAL_REPO_PASSWORD"
      
      if [ "$MANUAL_RELEASE" = "true" ]; then
        git config user.name "mobiTopp Release Pipeline"
        git config user.email "mobitopp@ifv.kit.edu"
      
        git tag -a "v$RELEASE_VERSION" "$CI_COMMIT_SHA" \
          -m "Release $RELEASE_VERSION"
      
        git push -o ci.skip origin "v$RELEASE_VERSION"
      fi
      
      echo "Updating project version variables"
      
      curl --fail-with-body \
        --request PUT \
        --header "PRIVATE-TOKEN:$API_TOKEN" \
        --form "value=$NEXT_MAJOR" \
        "$GITLAB_API_URL/MAJOR"
      
      curl --fail-with-body \
        --request PUT \
        --header "PRIVATE-TOKEN:$API_TOKEN" \
        --form "value=$NEXT_MINOR" \
        "$GITLAB_API_URL/MINOR"
      
      echo "Published $RELEASE_VERSION successfully"
      echo "Future snapshots will use ${NEXT_MAJOR}.${NEXT_MINOR}-SNAPSHOT"
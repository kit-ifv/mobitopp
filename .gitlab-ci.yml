stages: # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

build-job:
  stage: build
  image: amazoncorretto:21
  script:
    - ./gradlew compileJava
  artifacts:
    when: always
    paths:
      - build/

unit-test-job:
  stage: test
  image: amazoncorretto:21
  needs: ["build-job"]
  script:
    - ./gradlew test koverXmlReport koverLog
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: build/reports/kover/report.xml

    paths:
      - build/reports/kover/*
  coverage: "/application line coverage: ([0-9]+\\.?[0-9]*)%/"

code-style:
  stage: test
  needs: ["build-job"]
  image: amazoncorretto:21
  script:
    - ./gradlew detektGenerateConfig
    - ./gradlew detekt

stages: # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

build-job:
  stage: build
  image: amazoncorretto:21
  script:
    - ./gradlew compileJava
  artifacts:
    when: always
    paths:
      - build/

unit-test-job: # This job runs in the test stage.
  stage: test
  # It only starts when the job in the build stage completes successfully.
  image: amazoncorretto:21
  needs: ["build-job"]
#  variables:
#    JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
#    GRADLE_OPTS: "-Dorg.gradle.workers.max=1"
  script:
    - ./gradlew test koverXmlReport koverLog
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: build/reports/kover/report.xml

    paths:
      - build/reports/kover/*
  coverage: "/application line coverage: ([0-9]+\\.?[0-9]*)%/"

code-style:
  stage: test
  needs: ["build-job"]
  image: amazoncorretto:21
#  variables:
#    JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
#    GRADLE_OPTS: "-Dorg.gradle.workers.max=1"
  script:
    - ./gradlew detektGenerateConfig
    - ./gradlew detekt
